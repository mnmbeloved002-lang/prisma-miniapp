name: autofetch

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: autofetch-content

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: '20'

      - name: Fetch and normalize
        run: |
          node scripts/fetch-news-stub.cjs
          node scripts/normalize-news.cjs

      - name: Create PR if changes
        uses: peter-evans/create-pull-request@v6
        with:
          title: "autofetch: update news.json"
          branch: bot/autofetch-${{ github.run_id }}
          labels: content,autofetch,bot
          add-paths: public/news.json,docs/fetch/REPORT.md
