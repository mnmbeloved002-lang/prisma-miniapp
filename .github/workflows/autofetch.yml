name: autofetch
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'why running manually'
        required: false

concurrency:
  group: autofetch-content
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Autofetch (stub)
        run: node scripts/autofetch-stub.js

      - name: Check open content PRs
        id: openprs
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        run: |
          n=$(gh pr list --state open --label content --json number --jq 'length')
          echo "open_count=$n" >> $GITHUB_OUTPUT
          if [ "$n" -gt 0 ]; then echo "skip_pr=true" >> $GITHUB_ENV; fi

      - name: Detect changes (public/news.json)
        id: diff
        run: |
          if git diff --quiet --exit-code -- public/news.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create content PR
        if: env.skip_pr != 'true' && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          title: "autofetch: update news.json (UTC ${{ github.run_id }})"
          commit-message: "chore(content): autofetch news [phase-2/autofetch]"
          branch: bot/autofetch-${{ github.run_id }}
          labels: content,autofetch
          add-paths: |
            public/news.json
            docs/fetch/REPORT.md
          delete-branch: true

      - name: No changes / Skipped
        if: env.skip_pr == 'true' || steps.diff.outputs.changed != 'true'
        run: echo "No PR created (no changes or open content PR)."
