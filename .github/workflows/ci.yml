name: CI Quality Gate (L2)
on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
jobs:
  # Job 1: Быстрые проверки L1.7 (lint, test, build)
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/', cache: 'pnpm' }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: L1.7 Checks
        run: pnpm run sanity

  # Job 2: L2 Проверка безопасности (Gitleaks)
  gitleaks:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # Требуется для полной проверки истории
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        with: { config: '${{ github.workspace }}/.gitleaksignore' } # Используем стандартный конфиг

  # Job 3: L2 Проверка производительности (Lighthouse CI)
  lighthouse:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/', cache: 'pnpm' }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Build (Static Dist)
        run: pnpm run build
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Lighthouse CI Check
        run: |
          # Используем pnpx для прямого запуска
          pnpx @lhci/cli@0.13.x autorun \
            --config=lighthouserc.json \
            --collect.staticDistDir=dist 
