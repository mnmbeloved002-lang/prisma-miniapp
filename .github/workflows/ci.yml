name: CI Quality Gate (L2)

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  # Job 1: Быстрые проверки L1.7 (lint, test, build)
  verify:
    name: 1. L1.7 Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*' # ИСПРАВЛЕНО: 'lts/*'
          cache: 'pnpm'

      - name: Install Dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Run L1.7 Sanity Checks
        run: pnpm run sanity

  # Job 2: L2 Проверка безопасности (Gitleaks)
  gitleaks:
    name: 2. L2 Gitleaks
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with: { fetch-depth: 0 } # Требуется для полной проверки истории

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        # Мы НЕ используем config, Gitleaks-action v2 имеет 'sensible defaults'

  # Job 3: L2 Проверка производительности (Lighthouse CI)
  lighthouse:
    name: 3. L2 Lighthouse
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*' # ИСПРАВЛЕНО: 'lts/*'
          cache: 'pnpm'

      - name: Install Dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Build (Static Dist)
        run: pnpm run build

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Lighthouse CI Check
        run: |
          # Используем pnpx для прямого запуска
          pnpx @lhci/cli@0.13.x autorun \
            --config=lighthouserc.json \
            --collect.staticDistDir=dist
