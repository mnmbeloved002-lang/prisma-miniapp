name: L4 Quality Gate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # 1. Быстрые проверки (Код, Типы, Unit-тесты)
  quality:
    name: ⚡ Fast Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Deps
        run: pnpm install --frozen-lockfile

      - name: Lint & Typecheck
        run: |
          pnpm lint
          pnpm typecheck

      - name: Unit Tests (Vitest)
        run: pnpm test:cov

  # 2. Тяжелая артиллерия (Сборка + E2E)
  e2e:
    name: 🎭 E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Deps
        run: pnpm install --frozen-lockfile

      - name: Install Browsers
        run: npx playwright install chromium --with-deps

      - name: Build App
        run: pnpm build

      - name: Run Smoke Tests
        run: pnpm e2e:smoke
        env:
          CI: true

      # Сохраняем отчет только если тесты упали (экономим место)
      - name: Upload Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
