name: Lint + Typecheck + Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Lint + Typecheck
        run: |
          pnpm lint
          pnpm typecheck

      - name: Build
        run: pnpm build
