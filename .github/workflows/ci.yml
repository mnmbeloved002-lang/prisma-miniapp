name: CI Quality Gate (L2)
on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
jobs:
  # Job 1: Проверка безопасности (Gitleaks)
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2

  # Job 2: Быстрые проверки L1.7 (lint, test, build)
  verify:
    needs: gitleaks # Зависит от Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: 'pnpm' }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: L1.7 Checks
        run: pnpm run sanity

  # Job 3: L2 Проверка производительности (Lighthouse CI)
  lighthouse:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: 'pnpm' }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Build (Static Dist)
        run: pnpm run build
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Lighthouse CI Check
        run: |
          pnpx @lhci/cli@0.13.x autorun \
            --config=lighthouserc.json \
            --collect.staticDistDir=dist 
EOF
```

#### Шаг 4.2: Фиксация и отправка

Мы также должны зафиксировать все остальные изменения L2 (Semantic Release, MVP Logger), которые мы создали в Шагах 1-3.

```bash
# 1. Добавляем ВСЕ ИЗМЕНЕНИЯ (L2-файлы и обновленные L1.7-файлы)
git add .

# 2. Коммитим
git commit -m "feat(l2): implement final security, error reporting and release automation (L2-Free)"

# 3. Отправляем в dev
git push origin dev
```

---

### 3. Финальная проверка (DoD)

Ваш `push` запустит новый, исправленный CI-пайплайн.

1.  **Проверка CI:** Перейдите в GitHub Actions. Все Job'ы (`gitleaks`, `verify`, `lighthouse`) должны **позеленеть**.
2.  **Проверка API (после того как Vercel станет Ready):** Выполните эту команду, **заменив** плейсхолдер `<YOUR_DEV_URL>` на URL вашего проекта (`prisma-miniapp-dev.vercel.app`).

```bash
curl -X POST https://prisma-miniapp-dev.vercel.app/api/report-error \
  -H "Content-Type: application/json" \
  -d '{"message": "Final L2 check"}'
