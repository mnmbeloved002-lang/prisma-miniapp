name: CI Quality Gate (L2.3)

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
          run_install: false
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Lint + Typecheck
        run: pnpm lint && pnpm typecheck
      - name: Unit + Coverage
        run: pnpm vitest run --coverage
      - name: A11y smoke
        run: pnpm a11y
      - name: E2E smoke
        run: pnpm e2e:smoke
      - name: Bundle size
        run: pnpm size
