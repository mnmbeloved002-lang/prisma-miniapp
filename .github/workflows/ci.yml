name: CI Quality Gate (L2.3)

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: 1. L1.7 Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: 1. Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - name: 2. Setup Node.js (с кэшем pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run L1.7 Sanity Checks
        run: pnpm run sanity # <--- ВАЖНО: Lhci теперь будет падать здесь

  gitleaks:
    name: 2. L2 Gitleaks
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with: { fetch-depth: 0 } 
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    name: 3. L2 Lighthouse
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: 1. Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - name: 2. Setup Node.js (с кэшем pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (Static Dist)
        run: pnpm run build
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Lighthouse CI Check
        run: |
          pnpx @lhci/cli@0.13.x autorun \
            --config=lighthouserc.json \
            --collect.staticDistDir=dist
