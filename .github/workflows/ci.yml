name: CI Quality Gate (L2.3)

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: 1) Verify (Lint + Types + Build + Tests + Audit + Size + LHCI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:


      - name: Setup Node.js (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint + Typecheck + Tests + Audit + Build + Size
        run: pnpm run lint && pnpm run typecheck && pnpm run test:cov && pnpm run pkg:lint && pnpm run audit && pnpm run build && pnpm run size

      # Lighthouse отдельно, чтобы Chrome гарантированно был доступен
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Lighthouse CI (static dist)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm run lhci

      - name: Upload LHCI reports
        uses: actions/upload-artifact@v4
        with:
          name: lhci-reports
          path: .lighthouseci/*

  gitleaks:
    name: 2) Secret Scan (Gitleaks)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
