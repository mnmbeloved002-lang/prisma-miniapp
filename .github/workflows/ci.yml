name: CI Quality Gate (L2)
on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
jobs:
  # Job 1: Быстрые проверки L1.7 (lint, test, build)
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: 'pnpm' } # ИСПРАВЛЕНО: 'lts/*'
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: L1.7 Checks
        run: pnpm run sanity

  # Job 2: L2 Проверка безопасности (Gitleaks)
  gitleaks:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: 'pnpm' } # ИСПРАВЛЕНО: 'lts/*'
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2

  # Job 3: L2 Проверка производительности (Lighthouse CI)
  lighthouse:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: 'pnpm' } # ИСПРАВЛЕНО: 'lts/*'
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Build (Static Dist)
        run: pnpm run build
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Lighthouse CI Check
        run: |
          pnpx @lhci/cli@0.13.x autorun \
            --config=lighthouserc.json \
            --collect.staticDistDir=dist
```

#### Шаг 4.2: Фиксация и отправка

```bash
# 1. Добавляем измененный ci.yml
git add .github/workflows/ci.yml

# 2. Коммитим
git commit -m "fix(ci): correct node alias to lts/* for github actions"

# 3. Отправляем в dev
git push origin dev
```

---

### 3. Финальная проверка (DoD)

Ваш `push` запустит новый, исправленный CI-пайплайн.

1.  **Проверка CI:** Перейдите в GitHub Actions. Все Job'ы (`verify`, `gitleaks`, `lighthouse`) должны **позеленеть**.
2.  **Проверка API (после того как Vercel станет Ready):** Выполните эту команду, **заменив** плейсхолдер `<YOUR_DEV_URL>` на URL вашего проекта (`prisma-miniapp-dev.vercel.app`).

```bash
curl -X POST https://prisma-miniapp-dev.vercel.app/api/report-error \
  -H "Content-Type: application/json" \
  -d '{"message": "Final L2 check"}'
