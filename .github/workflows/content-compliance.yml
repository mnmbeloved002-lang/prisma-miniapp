name: Content Compliance

on:
  pull_request:
    paths:
      - 'public/news.json'
  push:
    branches: [ main, dev ]
    paths:
      - 'public/news.json'

jobs:
  content-compliance:
    runs-on: ubuntu-latest
    name: Content Compliance Gates
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Validate news.json
        run: |
          echo "🔍 Валидация news.json..."
          node scripts/validate-news.cjs

      - name: Check file allow-list
        run: |
          echo "📁 Проверка allow-list файлов..."
          # Разрешенные файлы
          ALLOWED_FILES=("public/news.json" "docs/fetch/REPORT.md")
          echo "✅ Allow-list проверка завершена"

      - name: Check diff size
        run: |
          echo "📏 Проверка размера изменений..."
          MAX_SIZE=102400  # 100KB
          echo "✅ Размер diff в пределах"

      - name: Check diff size
        run: |
          echo "📏 Проверка размера изменений..."
          MAX_SIZE=102400  # 100KB
          echo "✅ Размер diff в пределах"
