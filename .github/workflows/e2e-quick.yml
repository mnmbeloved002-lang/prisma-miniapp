name: e2e-quick

on:
  pull_request:
    branches: [dev]
  workflow_dispatch: {}

jobs:
  e2e_quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # нужны для загрузки SARIF в Code Scanning
    permissions:
      contents: read
      security-events: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
