name: e2e-quick

on:
  pull_request:
    branches: [dev]
  workflow_dispatch: {}

jobs:
  e2e_quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # нужны для загрузки SARIF в Code Scanning
    permissions:
      contents: read
      security-events: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git --redact -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.20.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # OSV без action/reusable — через официальный контейнер
      - name: OSV-Scanner (lockfile)
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/w" ghcr.io/google/osv-scanner:latest \
            --lockfile=/w/pnpm-lock.yaml --format sarif --output=/w/osv.sarif

      - name: Upload OSV SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./osv.sarif

      - name: Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/javascript
          generateSarif: true
          publishResults: false

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Install Chromium only
        run: npx playwright install --with-deps chromium

      - name: Unit+IT (Vitest + coverage)
        run: pnpm -s test:ci

      - name: E2E smoke
        run: pnpm -s e2e:smoke

      - name: A11y smoke
        run: pnpm -s e2e:a11y

      - name: Visual (non-blocking)
        run: pnpm -s e2e:visual || echo 'visual skipped'

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
