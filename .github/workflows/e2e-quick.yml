name: e2e-quick

on:
  pull_request: { branches: [dev] }
  workflow_dispatch: {}

jobs:
  # 1) Готовим артефакт с локфайлом для OSV
  prepare_lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare lockfile artifact
        run: cp pnpm-lock.yaml osv-lockfile-${{ github.sha }}.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: osv-lockfile-${{ github.sha }}
          path: osv-lockfile-${{ github.sha }}.yaml
          retention-days: 2

  # 2) УМЕСТНОЕ ПОДКЛЮЧЕНИЕ REUSABLE WORKFLOW OSV
  osv_scan:
    needs: prepare_lockfile
    permissions:
      contents: read
      security-events: write
    uses: google/osv-scanner/.github/workflows/osv-scanner-reusable.yml@main
    with:
      download-artifact: osv-lockfile-${{ github.sha }}
      scan-args: >-
        --lockfile=osv-scanner:osv-lockfile-${{ github.sha }}.yaml
      fail-on-vuln: true

  # 3) Быстрый E2E/Unit контур (как был), с правами для SARIF от Semgrep
  e2e_quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        with: { fail: true }

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with: { version: 10.20.0 }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/javascript
          generateSarif: true
          publishResults: false

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: semgrep.sarif }

      - name: Install Chromium only
        run: npx playwright install --with-deps chromium

      - name: Unit+IT (Vitest + coverage)
        run: pnpm -s test:ci

      - name: E2E smoke
        run: pnpm -s e2e:smoke

      - name: A11y smoke
        run: pnpm -s e2e:a11y

      - name: Visual (non-blocking)
        run: pnpm -s e2e:visual || echo 'visual skipped'

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
