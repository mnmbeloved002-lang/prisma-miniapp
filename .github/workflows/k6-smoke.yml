name: "k6 Smoke Test – nightly + on push"

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 3 * * *'   # каждый день в 03:00 UTC (06:00 МСК)

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install k6
        run: curl -L https://github.com/grafana/k6/releases/download/v0.53.0/k6-v0.53.0-linux-amd64.tar.gz | tar xz && sudo mv k6-*/k6 /usr/local/bin/

      - name: Build
        run: pnpm build

      - name: Run k6 smoke test
        run: |
          pnpm preview --host 0.0.0.0 --port 4173 &
          sleep 15
          k6 run tests/perf/k6-smoke.js

