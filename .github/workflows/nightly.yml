name: nightly
on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch: {}

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Serve dist
        run: node scripts/serve-dist.js &
      - name: Knip (dead code)
        run: npx knip --strict
