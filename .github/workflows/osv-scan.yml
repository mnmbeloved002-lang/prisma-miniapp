name: OSV Scan

on:
  push:
    branches: [dev]
  schedule:
    - cron: '30 12 * * 1' # еженедельно, понедельник 12:30 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: OSV Scanner
        uses: google/osv-scanner-action@v2.2.4
        with:
          # скан всего репо рекурсивно; при желании сузить — подставь свои аргументы
          scan-args: >-
            --recursive
            ./
          fail-on-vuln: true
