name: OSV-Scanner

on:
  push:
    branches: [dev]
  schedule:
    - cron: "30 12 * * 1" # еженедельно по понедельникам 12:30 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.2.4
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # по умолчанию сканирует весь репо рекурсивно; при желании сузить — пропиши свои аргументы
      scan-args: |-
        --recursive
        ./
      # при необходимости — переименуй файл результатов и/или смягчи фейл
      # results-file-name: results.sarif
      # fail-on-vuln: true
