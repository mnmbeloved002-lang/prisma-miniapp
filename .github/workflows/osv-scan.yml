name: OSV-Scanner

on:
  push: { branches: [dev] }
  schedule:
    - cron: "30 12 * * 1"  # еженедельно, 12:30 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-scheduled:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.2.4"
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: true
      upload-sarif: true
