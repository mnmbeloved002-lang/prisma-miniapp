name: quality-dev
on:
  push: { branches: [dev] }
  pull_request: { branches: [dev] }
permissions:
  contents: read
  security-events: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Lint + Typecheck
        run: pnpm lint && pnpm typecheck
      - name: Unit + Coverage (Vitest+c8)
        run: pnpm vitest run --coverage
      - name: Size limit
        run: pnpm size
      - name: A11y smoke (Playwright)
        run: |
          npx playwright install --with-deps
          pnpm a11y
      - name: OSV Scanner (deps vulns)
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: --lockfile=pnpm-lock.yaml --recursive .
          fail-on-vuln: true
      - name: Semgrep (JS/TS/React)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci
          generateSarif: true
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
      - name: Gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2.3.0
        with:
          report-format: sarif
          report-path: gitleaks.sarif
      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
