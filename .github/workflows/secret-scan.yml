name: Secret Scan (Gitleaks)

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # КРИТИЧЕСКИ ВАЖНО для доступа ко всем коммитам

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2  # Используем последнюю стабильную версию
        with:
          config-path: .gitleaks.toml
          # Убираем args - они вызывают конфликт с внутренней логикой
