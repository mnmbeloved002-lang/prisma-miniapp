name: Semgrep Security Scan

on:
  schedule:
    - cron: '0 6 * * *' # Ежедневно в 6:00 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

jobs:
  semgrep-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: python3 -m pip install --user semgrep

      - name: Run Semgrep Security Scan
        run: ~/.local/bin/semgrep ci --config p/ci --sarif > semgrep-report.sarif

      - name: Upload SARIF results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-report.sarif
