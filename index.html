<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Prisma MiniApp</title>
  </head>
  <body style="--bg:#0b0f1a; --surface:#0e1422; color:#e6e9f0; background:var(--bg);">
    <!-- 🔹 SSR-скелет шапки: обеспечивает наличие banner до гидратации -->
    <header
      role="banner"
      data-testid="app-header"
      class="sticky top-0 z-20"
      style="backdrop-filter:saturate(1.2) blur(8px); background:rgba(11,15,26,.7); border-bottom:1px solid rgba(255,255,255,.08)"
    >
      <div style="max-width:1080px; margin:0 auto; padding:12px 16px; display:flex; gap:12px; align-items:center;">
        <h1 style="position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;">
          Prisma MiniApp
        </h1>
        <div style="flex:1;">
          <label for="search" style="position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;">
            Поиск
          </label>
          <input
            id="search"
            role="searchbox"
            aria-label="Поиск новостей"
            placeholder="Поиск новостей…"
            type="search"
            style="width:100%; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:inherit; outline:none;"
          />
        </div>
        <button
          type="button"
          title="Показать закладки"
          aria-pressed="false"
          style="padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:transparent; color:inherit;"
        >
          ☆ Закладки
        </button>
      </div>
    </header>

    <!-- корень React -->
    <div id="root"></div>

    <!-- ❗ Правильно для Vite: только исходный вход -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
